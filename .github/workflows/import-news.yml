name: Importar notícias dos feeds

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: import-news-hourly
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HAS_IMPORTER_SECRET: ${{ secrets.DATABASE_URL_IMPORTER != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Avisar se o importador ainda usa a credencial completa
        if: env.HAS_IMPORTER_SECRET != 'true'
        run: echo "::warning::Cadastre o secret DATABASE_URL_IMPORTER com o papel atn_importer (db/roles.sql). Usando DATABASE_URL por enquanto."
      - name: Importar feeds RSS no Neon
        run: npm run news:import
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_IMPORTER || secrets.DATABASE_URL }}
